<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Em construção — Tratamento de água · Zera Brasil</title>
<style>
  :root { --azul:#0068B4; --verde:#2BA84A; --ink:#1A2332; --bg:#F6F8FB; --muted:#5A6478; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;padding:48px 40px;border-radius:12px;max-width:480px;text-align:center;box-shadow:0 10px 40px rgba(20,30,50,0.08)}
  .dot{width:10px;height:10px;background:var(--verde);border-radius:50%;display:inline-block;margin-right:8px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  h1{font-size:24px;margin-bottom:12px;color:var(--azul)}
  p{color:var(--muted);line-height:1.6;font-size:15px}
  .tag{display:inline-flex;align-items:center;background:#F0F7FF;color:var(--azul);font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;margin-bottom:20px}
</style>
</head>
<body>
<div class="card">
  <span class="tag"><span class="dot"></span>Em construção</span>
  <h1>Tratamento de água · Zera Brasil</h1>
  <p>Esta página está sendo preparada. Em breve, soluções químicas para tratamento de água industrial, caldeiras, torres de resfriamento e sistemas prediais.</p>
</div>
</body>
</html>
